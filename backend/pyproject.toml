[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-monitor-api"
version = "0.1.0"
description = "API do monitor de preços com alertas por e-mail"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    "httpx>=0.28",
    "postgrest>=2.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "ASYNC", "C4", "PT", "RET", "RUF", "S", "SIM"]
ignore = [
    "RUF001", # caracteres "ambíguos" são comuns em textos em português
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
