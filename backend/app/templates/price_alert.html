<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preço-alvo atingido</title>
</head>
<body style="margin:0;padding:24px;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px">
        <tr><td style="padding:32px">
          <p style="margin:0 0 8px;font-size:14px;font-weight:bold;color:#047857">Preço-alvo atingido</p>
          <h1 style="margin:0 0 24px;font-size:20px;line-height:1.4">{{ title }}</h1>
          {% if image_url %}
          <p style="margin:0 0 24px;text-align:center"><img src="{{ image_url }}" alt="" width="200" style="max-width:100%;height:auto"></p>
          {% endif %}
          <p style="margin:0;font-size:32px;font-weight:bold">{{ current_price }}</p>
          <p style="margin:4px 0 24px;font-size:14px;color:#475569">Seu alvo: {{ target_price }}</p>
          <p style="margin:0 0 16px"><a href="{{ product_url }}" style="display:inline-block;padding:12px 24px;background:#047857;border-radius:8px;color:#ffffff;font-weight:bold;text-decoration:none">Ver na loja</a></p>
          <p style="margin:0;font-size:14px"><a href="{{ details_url }}" style="color:#047857">Ver histórico ou ajustar o alerta</a></p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#64748b">O preço pode mudar a qualquer momento. Confira na loja antes de comprar.</p>
    </td></tr>
  </table>
</body>
</html>
