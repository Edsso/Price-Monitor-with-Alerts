<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Alto-falante Exemplo | Amazon.com.br</title></head>
<body>
  <span id="productTitle">   Alto-falante Exemplo com   Alexa   </span>
  <img id="landingImage" src="https://m.media-amazon.com/small.jpg"
       data-old-hires="https://m.media-amazon.com/large.jpg">
  <div id="corePriceDisplay_desktop_feature_div">
    <span class="a-price a-text-price"><span class="a-offscreen">R$ 1.649,00</span></span>
    <span class="a-price reinventPricePriceToPayMargin priceToPay"><span class="a-offscreen"> </span><span aria-hidden="true"><span class="a-price-symbol">R$</span><span class="a-price-whole">1.289<span class="a-price-decimal">,</span></span><span class="a-price-fraction">50</span></span></span>
  </div>
  <div id="availability"><span>Em estoque</span></div>
  <form id="addToCart">
    <input type="hidden" name="items[0.base][customerVisiblePrice][amount]" value="1289.5">
    <input type="hidden" name="items[0.base][customerVisiblePrice][currencyCode]" value="BRL">
  </form>
</body>
</html>
